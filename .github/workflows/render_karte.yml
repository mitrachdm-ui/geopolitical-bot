name: Video rendern (Test Satellitenkarte)
on:
  push:
    paths:
      - "videos/**/slides_karte.json"
  workflow_dispatch:
    inputs:
      folder:
        description: "Ordnername unter videos/"
        required: true
permissions:
  contents: write
concurrency:
  group: render-karte
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Ordner bestimmen
        id: dir
        run: |
          F="${{ github.event.inputs.folder }}"
          if [ -z "$F" ]; then F=$(git diff --name-only HEAD~1 HEAD -- 'videos/*/slides_karte.json' | head -1 | cut -d/ -f2); fi
          echo "folder=$F" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pillow numpy edge-tts
      - name: Rendern
        run: python pipeline/make_video_karte.py "videos/${{ steps.dir.outputs.folder }}"
      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="${{ steps.dir.outputs.folder }}"
          MP4=$(ls videos/$F/*.mp4 | head -1)
          TAG="video-$F"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$F" --notes "Test Satellitenkarte"
          gh release upload "$TAG" "$MP4" --clobber
