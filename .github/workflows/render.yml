name: Video rendern

on:
  push:
    paths:
      - "videos/**/slides.json"
  workflow_dispatch:
    inputs:
      folder:
        description: "Ordnername unter videos/ (leer = neuester)"
        required: false

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Ordner bestimmen
        id: dir
        run: |
          # Ordner relativ zu videos/, z. B. "2026-10-22_Thema" oder "2026-10-22_Thema/youtube" (YouTube-Variante)
          F="${{ github.event.inputs.folder }}"
          if [ -z "$F" ] && [ "${{ github.event_name }}" = "push" ]; then
            F=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'videos/*/slides.json' 'videos/*/youtube/slides.json' \
                | sed -e 's#^videos/##' -e 's#/slides.json$##' | sort -u | tr '\n' ' ')
          fi
          if [ -z "${F// /}" ]; then F=$(ls -1 videos | sort | tail -1); fi
          echo "folders=$F" >> "$GITHUB_OUTPUT"
          echo "Ordner: $F"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q pillow numpy edge-tts

      - name: Rendern (mit KI-Stimme)
        run: |
          for F in ${{ steps.dir.outputs.folders }}; do
            echo "== $F"
            if grep -q '"renderer": *"karte"' "videos/$F/slides.json"; then
              python pipeline/make_video_karte.py "videos/$F"      # Satelliten-Stil
            else
              python pipeline/make_video.py "videos/$F"
            fi
          done

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for F in ${{ steps.dir.outputs.folders }}; do
            MP4=$(ls videos/$F/*.mp4 | head -1)
            TAG="video-${F//\//-}"          # 2026-10-22_Thema/youtube -> video-2026-10-22_Thema-youtube
            NOTES="videos/$F/POSTEN.txt"; [ -f "$NOTES" ] || NOTES="videos/${F%%/*}/POSTEN.txt"
            gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "${F//\// – }" --notes-file "$NOTES"
            gh release upload "$TAG" "$MP4" --clobber
            echo "URL: https://github.com/${{ github.repository }}/releases/download/$TAG/$(basename $MP4)"
          done
